name: Docker Build and Test

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Create .env file
      run: cp .env.example .env

    - name: Start Docker Compose services
      run: |
        docker compose up -d db
        echo "Waiting for database to be ready..."
        sleep 10

    - name: Build and start Odoo
      run: |
        docker compose up -d odoo
        echo "Waiting for Odoo to be ready..."
        sleep 30

    - name: Check Odoo status
      run: |
        docker compose ps
        docker compose logs odoo

    - name: Health check
      run: |
        echo "Checking if Odoo is responding..."
        max_attempts=10
        attempt=1
        while [ $attempt -le $max_attempts ]; do
          if curl -f http://localhost:8069/web/database/selector; then
            echo "✓ Odoo is running!"
            exit 0
          fi
          echo "Attempt $attempt/$max_attempts failed, waiting..."
          sleep 10
          attempt=$((attempt + 1))
        done
        echo "✗ Odoo failed to start"
        docker compose logs odoo
        exit 1

    - name: Run module tests (if any)
      run: |
        echo "Running Odoo module tests..."
        # Add your test commands here when you have custom modules
        # docker compose exec -T odoo odoo -d test_db -i module_name --test-enable --stop-after-init

    - name: Stop services
      if: always()
      run: docker compose down -v

  build-custom-image:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/odoo
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Create Dockerfile for custom Odoo
      run: |
        cat > Dockerfile <<'EOF'
        FROM odoo:19.0

        USER root

        # Copy custom addons
        COPY ./addons /mnt/extra-addons

        # Copy configuration
        COPY ./config/odoo.conf /etc/odoo/odoo.conf

        # Install any additional Python dependencies if needed
        # COPY requirements.txt /tmp/
        # RUN pip3 install -r /tmp/requirements.txt

        # Set correct permissions
        RUN chown -R odoo:odoo /mnt/extra-addons

        USER odoo
        EOF

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate deployment summary
      run: |
        echo "## 🐳 Docker Image Built Successfully" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/odoo\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Pull the image:" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/odoo:latest" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
