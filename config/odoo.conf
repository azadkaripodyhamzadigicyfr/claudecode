[options]
# Odoo 19 Configuration File

# Database Configuration
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = False
db_sslmode = prefer

# Database Connection Pool
db_maxconn = 64
db_template = template0

# Server Configuration
http_port = 8069
longpolling_port = 8072
http_interface = 0.0.0.0
proxy_mode = True

# Workers Configuration (for production)
# Uncomment and adjust based on your server resources
# Formula: (CPU cores * 2) + 1
# workers = 5
# max_cron_threads = 2

# Memory Limits (for production)
# limit_memory_hard = 2684354560
# limit_memory_soft = 2147483648
# limit_request = 8192
# limit_time_cpu = 600
# limit_time_real = 1200
# limit_time_real_cron = -1

# Logging Configuration
logfile = /var/log/odoo/odoo.log
log_level = info
log_handler = :INFO
# For development, you might want to use:
# log_level = debug
# log_handler = :DEBUG

# Addons Path
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

# Data Directory
data_dir = /var/lib/odoo

# Admin Master Password (CHANGE THIS!)
# This password protects database operations
# admin_passwd = $pbkdf2-sha512$...
# For development, you can use a simple password:
admin_passwd = admin

# Security
list_db = True

# Server-wide modules
server_wide_modules = base,web

# Email Configuration (configure when needed)
# smtp_server = smtp.gmail.com
# smtp_port = 587
# smtp_ssl = False
# smtp_user = your-email@gmail.com
# smtp_password = your-app-password
# email_from = your-email@gmail.com

# Session Configuration
# session_timeout = 3600

# Translation
# load_language = en_US
# translate_modules = ['all']

# CSV Import
# csv_internal_sep = ,

# Reporting
# reportgz = False

# Developer Mode (for development)
# dev_mode = reload,qweb,werkzeug,xml
